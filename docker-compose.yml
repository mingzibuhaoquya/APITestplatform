services:
  mysql:
    image: mysql:8.4
    command: --default-time-zone=+08:00
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: api_test_platform
      MYSQL_USER: api_test
      MYSQL_PASSWORD: api_test
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: mysql+pymysql://api_test:api_test@mysql:3306/api_test_platform?charset=utf8mb4
      APP_SECRET: change-me-in-production
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs

  worker:
    build: ./backend
    command: python -m app.services.task_queue_worker
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: mysql+pymysql://api_test:api_test@mysql:3306/api_test_platform?charset=utf8mb4
      APP_SECRET: change-me-in-production
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      disable: true

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
